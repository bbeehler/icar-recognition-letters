<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I-CAR Recognition Letters</title>
<meta name="description" content="Request and verify official I-CAR Canada Gold Class and Platinum recognition letters.">
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#f0f2f5; --text:#16191f; --muted:#5b6370;
  --line:#dde1e7; --accent:#C8102E; --accent-ink:#ffffff; --accent-soft:#fbe9ec;
  --ok:#137a3f; --ok-soft:#e5f4ea; --warn:#9a5b00; --warn-soft:#fdf2df; --err:#b42318; --err-soft:#fdecea;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:0 0 .4em}
h1{font-size:1.6rem;letter-spacing:-.01em}
h2{font-size:1.2rem}
h3{font-size:1rem}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hidden{display:none!important}

/* layout */
.pub-wrap{max-width:620px;margin:0 auto;padding:28px 16px 48px}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem}
.brand img{max-height:38px;max-width:180px}
.brand .mark{width:10px;height:28px;background:var(--accent);border-radius:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}
.card + .card,.grid2 + .card,.card + .grid2,.stats + .grid2{margin-top:16px}
.grid2 > .card{margin-top:0}
.stack > * + *{margin-top:14px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 200px}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* forms */
label.f{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.help{font-size:.8rem;color:var(--muted);margin-top:4px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],select,textarea{
  width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid #c7ccd4;border-radius:8px;padding:10px 12px;min-height:44px}
textarea{min-height:220px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.choice:focus-within{outline:2px solid var(--accent);outline-offset:1px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;flex:none}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.choices{grid-template-columns:1fr}}
.choice{position:relative;border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 44px;cursor:pointer;background:var(--surface)}
.choice input{position:absolute;left:14px;top:17px;width:18px;height:18px;accent-color:var(--accent)}
.choice b{display:block}
.choice span{font-size:.85rem;color:var(--muted)}
.choice:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;border-radius:8px;border:1px solid transparent;
  padding:10px 18px;min-height:44px;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn:hover{filter:brightness(.94)}
.btn[disabled]{opacity:.55;cursor:wait}
.btn.secondary{background:var(--surface);color:var(--text);border-color:#c7ccd4}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 10px;min-height:34px}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.85rem}
.btn.danger{background:var(--surface);color:var(--err);border-color:#f0b4ae}
.btn.block{width:100%}

.alert{border-radius:8px;padding:12px 14px;font-size:.92rem}
.alert.err{background:var(--err-soft);color:var(--err)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--surface-2);color:var(--text)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em}
.bigcode{font-size:1.35rem;font-weight:700}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang-toggle button{font:inherit;font-size:.85rem;border:0;background:var(--surface);padding:6px 12px;cursor:pointer;color:var(--muted);min-height:34px}
.lang-toggle button.on{background:var(--text);color:#fff}
.badge{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.gold{background:#fbf1d6;color:#7a5600}
.badge.plat{background:#e8ecf3;color:#36435a}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.off{background:var(--err-soft);color:var(--err)}
.verify-status{display:flex;gap:14px;align-items:center}
.verify-icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;flex:none}
.verify-icon.ok{background:var(--ok-soft);color:var(--ok)}
.verify-icon.bad{background:var(--err-soft);color:var(--err)}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-weight:600}
footer.pub{margin-top:22px;text-align:center;font-size:.85rem;color:var(--muted)}

/* admin */
.topbar{background:var(--text);color:#fff}
.topbar .in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar .who{font-size:.85rem;opacity:.85}
.topright{display:flex;align-items:center;gap:8px;flex:0 0 auto}
@media (max-width:600px){.topbar .who{display:none}}
.topbar .btn.sm{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.tabs .in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px}
.tabs button{font:inherit;font-weight:600;font-size:.92rem;background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.adm{max-width:1180px;margin:0 auto;padding:22px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stat .n{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
.stat .l{font-size:.82rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:.8rem;color:var(--muted);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.nowrap{white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.filters > *{flex:0 1 auto}
.filters .grow{flex:1 1 240px}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:.88rem}
.mapgrid{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:8px 14px;align-items:center}
.req{color:var(--err)}
.ph{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;cursor:pointer}
.copybox{position:relative}
.copybox textarea{min-height:160px;font-size:.88rem}
.copybox .btn{position:absolute;top:8px;right:8px}
.imgprev{max-height:60px;max-width:220px;border:1px dashed var(--line);border-radius:6px;padding:4px;background:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:12px;max-width:480px;width:100%;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--text);color:#fff;padding:10px 16px;border-radius:8px;font-size:.9rem;box-shadow:var(--shadow);max-width:90vw}
#toast div.err{background:var(--err)}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:grid;place-items:center;min-height:60vh}
</style>
</head>
<body>
<div id="app"><div class="center"><span class="spinner"></span></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
/* =====================================================================
   I-CAR Canada Recognition Letters
   Customer page:   index.html            (or ?program=gold_class&id=12345&lang=fr)
   Verify page:     index.html#/verify/CODE
   Staff back end:  index.html#/admin
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://fwtzwkdcxkcnscqkyxhf.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3dHp3a2RjeGtjbnNjcWt5eGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMjczNTgsImV4cCI6MjEwODYwMzM1OH0.p3WJnw5_Y4-Lk0kYU6JW_lzor6r7DC1GcfQEuLUF1KQ',
  STAFF_EMAIL_DOMAIN: 'aiacanada.com',
  // Leave blank to use this page's own address in QR codes and share links.
  PUBLIC_URL: ''
};
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg, kind = '') {
  const d = document.createElement('div'); d.textContent = msg; if (kind) d.className = kind;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), kind === 'err' ? 6000 : 3200);
}
function publicUrl() { return (CONFIG.PUBLIC_URL || (location.origin + location.pathname)).replace(/#.*$/, ''); }
function verifyUrl(code) { return publicUrl() + '#/verify/' + encodeURIComponent(code); }
function parseDate(d) { if (!d) return null; if (d instanceof Date) return d; return new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d + 'T12:00:00' : d); }
function fmtDate(d, lang = 'en') { const dt = parseDate(d); if (!dt || isNaN(dt)) return ''; return dt.toLocaleDateString(lang === 'fr' ? 'fr-CA' : 'en-CA', { year: 'numeric', month: 'long', day: 'numeric' }); }
function fmtDateTime(d) { const dt = parseDate(d); return dt ? dt.toLocaleString('en-CA', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }
function busy(btn, on, label) { if (!btn) return; if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + esc(label || ''); } else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = btn.dataset.l; } }
async function copyText(t) { try { await navigator.clipboard.writeText(t); toast('Copied'); } catch { toast('Copy failed. Select the text and copy it manually.', 'err'); } }
function loadScript(src) { return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
function applyAccent(hex) { if (/^#[0-9a-f]{6}$/i.test(hex || '')) { document.documentElement.style.setProperty('--accent', hex); const n = parseInt(hex.slice(1), 16); document.documentElement.style.setProperty('--accent-soft', `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},.08)`); } }
const PROGRAM = {
  gold_class: { en: 'Gold Class', fr: 'Gold Class', badge: 'gold', slug: 'Gold-Class' },
  platinum: { en: 'Platinum', fr: 'Platinum', badge: 'plat', slug: 'Platinum' }
};

/* ---------- letter content ---------- */
let CONTENT = null;
async function loadContent(force = false) {
  if (!CONTENT || force) {
    const { data, error } = await sb.rpc('get_letter_content');
    if (error) throw error;
    CONTENT = data || { settings: {}, templates: [] };
    applyAccent(CONTENT.settings?.accent_color);
  }
  return CONTENT;
}

/* ---------- PDF letter ---------- */
const PDF_T = {
  en: { box: 'Verify this letter', code: 'Verification code', scan: 'Scan the QR code or visit:', issued: 'Issued' },
  fr: { box: 'Vérifier cette lettre', code: 'Code de vérification', scan: 'Balayez le code QR ou visitez :', issued: 'Émise le' }
};
function fill(t, v) { return String(t || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (v[k] ?? '')); }
function rgb(hex) { const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); const n = parseInt(m ? m[1] : 'C8102E', 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function imgFmt(u) { return /^data:image\/png/i.test(u) ? 'PNG' : 'JPEG'; }
function imgDims(src) { return new Promise(r => { const i = new Image(); i.onload = () => r({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => r(null); i.src = src; }); }
function drawQR(doc, text, x, y, size) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), c = size / n;
  doc.setFillColor(255, 255, 255); doc.rect(x - 3, y - 3, size + 6, size + 6, 'F');
  doc.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) if (qr.isDark(r, k)) doc.rect(x + k * c, y + r * c, c + 0.05, c + 0.05, 'F');
}

/* L = { program, language, name, icar_id, shop_name, address, city, province, postal_code, recognition_date, issued_at, code } */
async function buildLetterPdf(L, content) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter' });
  const S = content.settings || {};
  const lang = L.language === 'fr' ? 'fr' : 'en';
  const tpl = (content.templates || []).find(t => t.program === L.program && t.language === lang) || { heading: '', body: '' };
  const A = rgb(S.accent_color);
  const W = 612, H = 792, M = 72, CW = W - 2 * M;
  const issued = L.issued_at ? parseDate(L.issued_at) : new Date();
  const v = {
    name: L.name || '', icar_id: L.icar_id || '', shop_name: L.shop_name || '',
    date: fmtDate(issued, lang), recognition_date: L.recognition_date ? fmtDate(L.recognition_date, lang) : '',
    program: PROGRAM[L.program]?.[lang] || ''
  };
  doc.setProperties({ title: fill(tpl.heading, v), author: S.org_name || 'I-CAR Canada', subject: v.name });

  const footer = () => {
    if (!S.footer_text) return;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(120, 120, 120);
    doc.text(S.footer_text, W / 2, H - 28, { align: 'center' });
  };
  const newPage = () => { footer(); doc.addPage(); return 72; };

  let y = 50;
  let drewLogo = false;
  if (S.logo_data) {
    const d = await imgDims(S.logo_data);
    if (d) { let h = 46, w = h * d.w / d.h; if (w > 220) { w = 220; h = w * d.h / d.w; } doc.addImage(S.logo_data, imgFmt(S.logo_data), M, y, w, h); y += h; drewLogo = true; }
  }
  if (!drewLogo) { doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(...A); doc.text(S.org_name || 'I-CAR Canada', M, y + 22); y += 30; }
  y += 14; doc.setDrawColor(...A); doc.setLineWidth(2); doc.line(M, y, W - M, y); y += 34;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(28, 28, 28);
  doc.text(v.date, M, y); y += 28;

  const addr = [];
  if (L.program === 'platinum' && L.shop_name) addr.push(L.shop_name);
  if (L.address) addr.push(L.address);
  const cityLine = ([L.city, L.province].filter(Boolean).join(', ') + (L.postal_code ? '  ' + L.postal_code : '')).trim();
  if (cityLine) addr.push(cityLine);
  doc.setFont('helvetica', 'bold'); doc.text(doc.splitTextToSize(v.name, CW)[0], M, y); y += 15;
  doc.setFont('helvetica', 'normal'); for (const a of addr) { doc.text(doc.splitTextToSize(a, CW)[0], M, y); y += 15; }
  y += 20;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.setTextColor(...A);
  for (const line of doc.splitTextToSize(fill(tpl.heading, v), CW)) { doc.text(line, M, y); y += 18; }
  y += 10;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(28, 28, 28);
  for (const p of fill(tpl.body, v).split(/\n\s*\n/)) {
    const txt = p.replace(/\s*\n\s*/g, ' ').trim(); if (!txt) continue;
    for (const line of doc.splitTextToSize(txt, CW)) { if (y > H - 96) { y = newPage(); doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(28, 28, 28); } doc.text(line, M, y); y += 15.5; }
    y += 9;
  }

  // signature block, then the verification panel at the foot of the last page
  const PANEL_TOP = H - 132;
  if (y + 84 > PANEL_TOP - 8) y = newPage();
  if (S.signature_data) {
    const d = await imgDims(S.signature_data);
    if (d) { let h = 40, w = h * d.w / d.h; if (w > 180) { w = 180; h = w * d.h / d.w; } doc.addImage(S.signature_data, imgFmt(S.signature_data), M, y - 6, w, h); y += h + 4; }
  } else y += 26;
  doc.setTextColor(28, 28, 28);
  if (S.signatory_name) { doc.setFont('helvetica', 'bold'); doc.text(S.signatory_name, M, y); y += 15; }
  const sigTitle = lang === 'fr' ? S.signatory_title_fr : S.signatory_title_en;
  if (sigTitle) { doc.setFont('helvetica', 'normal'); doc.text(sigTitle, M, y); y += 15; }

  if (L.code) {
    const P = PDF_T[lang], bx = M, by = PANEL_TOP, bw = CW, bh = 82, url = verifyUrl(L.code);
    doc.setFillColor(245, 246, 248); doc.setDrawColor(221, 225, 231); doc.setLineWidth(0.8);
    doc.roundedRect(bx, by, bw, bh, 6, 6, 'FD');
    drawQR(doc, url, bx + 12, by + 11, 60);
    const tx = bx + 90;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(...A); doc.text(P.box, tx, by + 20);
    doc.setTextColor(28, 28, 28); doc.setFont('helvetica', 'normal'); doc.setFontSize(9);
    doc.text(`${P.code}: `, tx, by + 35);
    const cw = doc.getTextWidth(`${P.code}: `);
    doc.setFont('courier', 'bold'); doc.setFontSize(10.5); doc.text(L.code, tx + cw, by + 35);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(80, 80, 80);
    doc.text(P.scan, tx, by + 49);
    doc.setTextColor(...A); doc.text(doc.splitTextToSize(url, bw - 100)[0], tx, by + 61);
    doc.setTextColor(80, 80, 80); doc.text(`${P.issued} ${v.date}`, tx, by + 73);
  }
  footer();
  return doc;
}
function letterFilename(L) { return `I-CAR-${PROGRAM[L.program]?.slug || 'Recognition'}-Letter-${String(L.icar_id || '').replace(/[^A-Za-z0-9-]/g, '')}${L.code ? '-' + L.code : ''}.pdf`; }

/* =====================================================================
   PUBLIC PAGES
   ===================================================================== */
const T = {
  en: {
    title: 'Request your I-CAR recognition letter',
    intro: 'Gold Class businesses and Platinum individuals can download an official letter confirming their I-CAR recognition at any time.',
    choose: 'Which recognition is this for?',
    gold: 'Gold Class', goldSub: 'For collision repair businesses',
    plat: 'Platinum', platSub: 'For individual technicians and professionals',
    icarId: 'I-CAR ID', icarHelpGold: "Your business's I-CAR ID", icarHelpPlat: 'Your personal I-CAR ID',
    postal: 'Business postal code', postalHelp: 'The postal code I-CAR has on file for your business',
    last: 'Last name', lastHelp: 'As it appears on your I-CAR profile',
    you: 'Your contact details', yourName: 'Your name', yourEmail: 'Your email',

async function submitRequest(e) {
  e.preventDefault(); savePubForm();
  const t = T[LANG], f = PUB.form, btn = $('#reqBtn'), msg = $('#reqMsg');
  const checkWord = PUB.program === 'gold_class' ? t.checkGold : t.checkPlat;
  const showErr = k => { msg.innerHTML = `<div class="alert err" role="alert">${esc((t.err[k] || t.err.generic).replace('{check}', checkWord))}</div>`; };
  msg.innerHTML = '';
  if (!String(f.icar_id || '').trim() || !String(f.check || '').trim()) return showErr('missing_fields');
  if (!String(f.rname || '').trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f.remail || '').trim())) return showErr('invalid_contact');
  busy(btn, true, t.working);
  try {
    const { data, error } = await sb.rpc('request_letter', {
      p_program: PUB.program, p_icar_id: f.icar_id, p_check: f.check,
      p_requester_name: f.rname, p_requester_email: f.remail,
      p_language: f.letter_lang || LANG, p_marketing_consent: !!f.consent
    });
    if (error) throw error;
    if (!data?.ok) { busy(btn, false); return showErr(data?.error || 'generic'); }
    busy(btn, true, t.making);
    await loadContent(true);
    PUB.result = data;
    await downloadLetter(data);
    renderReady();
  } catch (err) { console.error(err); busy(btn, false); showErr('generic'); }
}
async function downloadLetter(r) { const doc = await buildLetterPdf(r, CONTENT); doc.save(letterFilename(r)); }

  $('#againBtn').onclick = async e => { busy(e.currentTarget, true); try { await downloadLetter(r); } finally { busy(e.currentTarget, false); } };

async function renderAdmin() {
  document.documentElement.lang = 'en';
  const { data: { session } } = await sb.auth.getSession();
  ADM.session = session;
  if (!session) return renderSignIn();
  if (session.user.user_metadata?.must_change_password) return renderChangePassword(true);
  let { data: staff } = await sb.from('staff').select('*').eq('user_id', session.user.id).maybeSingle();
  if (!staff) {
    const { data: need } = await sb.rpc('setup_needed');

      const { data: claimed, error } = await sb.rpc('claim_first_admin');
      if (claimed) ({ data: staff } = await sb.from('staff').select('*').eq('user_id', session.user.id).maybeSingle());
      else if (!error) {
        app.innerHTML = authCard(`<h2>Use your @${esc(CONFIG.STAFF_EMAIL_DOMAIN)} email</h2><p class="muted">The first administrator must sign up with an @${esc(CONFIG.STAFF_EMAIL_DOMAIN)} address.</p><button class="btn secondary" id="out">Sign out</button>`);

function renderChangePassword(forced) {
  const html = `<h2>${forced ? 'Choose a new password' : 'Change password'}</h2>

      <div id="cpMsg"></div><div class="row"><button class="btn" id="cpBtn">Save password</button>${forced ? '' : '<button type="button" class="btn secondary" id="cpCancel">Cancel</button>'}</div>
    </form>`;
  if (forced) app.innerHTML = authCard(html); else openModal(html);
  if (!forced) $('#cpCancel').onclick = closeModal;
  $('#cpForm').onsubmit = async e => {
    e.preventDefault(); const a = $('#cp1').value, b = $('#cp2').value, m = $('#cpMsg');
    if (a.length < 10) return m.innerHTML = '<div class="alert err">Use at least 10 characters.</div>';
    if (a !== b) return m.innerHTML = '<div class="alert err">The passwords don’t match.</div>';
    busy($('#cpBtn'), true, 'Saving…');
    const { error } = await sb.auth.updateUser({ password: a, data: { must_change_password: false } });
    busy($('#cpBtn'), false);
    if (error) return m.innerHTML = `<div class="alert err">${esc(error.message)}</div>`;
    toast('Password updated'); if (forced) renderAdmin(); else closeModal();
  };
}

function excelDateToISO(v) {
  if (v === '' || v == null) return '';
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s); return isNaN(d) ? '' : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
async function startUpload(program, file) {
  const area = $('#uploadArea');
  area.innerHTML = `<div class="card"><span class="spinner"></span> Reading ${esc(file.name)}…</div>`;
  try {
    await loadScript(XLSX_SRC);
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    UPLOAD = { program, file: file.name, wb, sheet: wb.SheetNames[0] };
    readSheet(); renderMapping();
  } catch (e) { area.innerHTML = `<div class="alert err">Couldn’t read that file: ${esc(e.message)}</div>`; }
}
function readSheet() {
  const ws = UPLOAD.wb.Sheets[UPLOAD.sheet];
  const rows = XLSX.utils.sheet_to_json(ws, { defval: '', raw: true });
  UPLOAD.rows = rows;
  UPLOAD.cols = rows.length ? Object.keys(rows.reduce((a, r) => Object.assign(a, r), {})) : [];
  const used = new Set(); UPLOAD.map = {};
  for (const f of FIELDS[UPLOAD.program]) {
    const hit = UPLOAD.cols.find(c => !used.has(c) && f.rx.test(c.trim()));
    if (hit) { UPLOAD.map[f.k] = hit; used.add(hit); }
  }
}
function buildRows() {
  const m = UPLOAD.map, P = UPLOAD.program, get = (r, k) => (m[k] ? String(r[m[k]] ?? '').trim() : '');
  return UPLOAD.rows.map(r => {
    const first = get(r, 'first_name'), last = get(r, 'last_name');
    const name = get(r, 'name') || [first, last].filter(Boolean).join(' ');
    const o = { icar_id: get(r, 'icar_id'), name, recognition_date: m.recognition_date ? excelDateToISO(r[m.recognition_date]) : '' };
    if (P === 'gold_class') Object.assign(o, { address: get(r, 'address'), city: get(r, 'city'), province: get(r, 'province'), postal_code: get(r, 'postal_code') });
    else Object.assign(o, { last_name: last, shop_name: get(r, 'shop_name') });
    return o;
  });
}
function renderMapping() {
  const U = UPLOAD, P = U.program, fields = FIELDS[P];
  const rows = buildRows();
  const valid = rows.filter(r => r.icar_id && r.name);
  const noCheck = P === 'gold_class' ? valid.filter(r => !r.postal_code).length : valid.filter(r => !r.last_name && !/\s/.test(r.name)).length;
  const ids = new Map(); valid.forEach(r => { const k = r.icar_id.toUpperCase().replace(/[^A-Z0-9]/g, ''); ids.set(k, (ids.get(k) || 0) + 1); });
  const dups = [...ids.values()].filter(n => n > 1).length;
  const missingReq = !U.map.icar_id || (P === 'gold_class' ? !U.map.name || !U.map.postal_code : !(U.map.name || (U.map.first_name && U.map.last_name)));
  const opt = k => `<option value="">— not in file —</option>` + U.cols.map(c => `<option ${U.map[k] === c ? 'selected' : ''}>${esc(c)}</option>`).join('');
  $('#uploadArea').innerHTML = `<div class="card stack">
    <div class="spread"><h2 style="margin:0">Update the ${progBadge(P)} list</h2><button class="btn sm secondary" id="upCancel">Cancel</button></div>
    <p class="muted" style="margin:0">${esc(U.file)} · ${U.rows.length.toLocaleString()} rows${U.wb.SheetNames.length > 1 ? ` · sheet <select id="upSheet" style="width:auto;min-height:34px;padding:4px 8px">${U.wb.SheetNames.map(s => `<option ${s === U.sheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>` : ''}</p>
    <h3 style="margin-top:8px">1. Match the columns</h3>
    <p class="small muted" style="margin:0">We matched what we could. Check each one.</p>
    <div class="mapgrid">${fields.map(f => `<label for="map_${f.k}"><b>${f.label}</b>${f.req ? ' <span class="req">*</span>' : ''}${f.note ? `<div class="help" style="margin:0">${f.note}</div>` : ''}</label><select id="map_${f.k}" data-map="${f.k}">${opt(f.k)}</select>`).join('')}</div>
    <h3 style="margin-top:8px">2. Check the result</h3>
    <div class="row" style="gap:8px">
      <div class="alert ${valid.length ? 'ok' : 'err'}"><b>${valid.length.toLocaleString()}</b> records will be loaded</div>
      ${rows.length - valid.length ? `<div class="alert warn"><b>${(rows.length - valid.length).toLocaleString()}</b> ${rows.length - valid.length === 1 ? 'row' : 'rows'} skipped (no I-CAR ID or name)</div>` : ''}
      ${noCheck ? `<div class="alert warn"><b>${noCheck.toLocaleString()}</b> ${noCheck === 1 ? 'has' : 'have'} no ${P === 'gold_class' ? 'postal code' : 'last name'}, so they can’t request a letter</div>` : ''}
      ${dups ? `<div class="alert info"><b>${dups.toLocaleString()}</b> I-CAR IDs appear more than once</div>` : ''}
    </div>
    <div class="tablewrap"><table><thead><tr><th>I-CAR ID</th><th>Name</th>${P === 'gold_class' ? '<th>Address</th><th>Postal code</th>' : '<th>Last name</th><th>Business</th>'}<th>Recognition date</th></tr></thead><tbody>
      ${valid.slice(0, 6).map(r => `<tr><td>${esc(r.icar_id)}</td><td>${esc(r.name)}</td>${P === 'gold_class' ? `<td>${esc([r.address, r.city, r.province].filter(Boolean).join(', '))}</td><td>${esc(r.postal_code)}</td>` : `<td>${esc(r.last_name || r.name.split(/\s+/).pop())}</td><td>${esc(r.shop_name)}</td>`}<td>${esc(r.recognition_date)}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nothing to preview yet. Match the required columns.</td></tr>'}
    </tbody></table></div>
    <h3 style="margin-top:8px">3. Replace the list</h3>
    ${missingReq ? '<div class="alert err">Match the required columns (*) first.</div>' : ''}
    <div><button class="btn" id="upGo" ${missingReq || !valid.length ? 'disabled' : ''}>Replace the ${PROGRAM[P].en} list with ${valid.length.toLocaleString()} records</button></div>
  </div>`;
  $('#upCancel').onclick = () => { UPLOAD = null; $('#uploadArea').innerHTML = ''; };
  $('#upSheet') && ($('#upSheet').onchange = e => { U.sheet = e.target.value; readSheet(); renderMapping(); });
  $$('[data-map]').forEach(s => s.onchange = () => { U.map[s.dataset.map] = s.value || undefined; renderMapping(); });
  $('#upGo').onclick = async e => {
    busy(e.currentTarget, true, 'Uploading…');
    const { data, error } = await sb.rpc('replace_recognition_list', { p_program: P, p_filename: U.file, p_rows: valid });
    if (error) { busy(e.currentTarget, false); toast(error.message, 'err'); return; }
    toast(`${PROGRAM[P].en} list updated: ${data.inserted.toLocaleString()} records`);
    UPLOAD = null; viewLists();
  };
}

const LF = { q: '', program: '', consent: '', from: '', to: '', page: 0, size: 50 };
function lettersQuery(sel = '*', opts = {}) {
  let q = sb.from('letter_requests').select(sel, opts).order('created_at', { ascending: false });
  if (LF.program) q = q.eq('program', LF.program);
  if (LF.consent) q = q.eq('marketing_consent', LF.consent === 'yes');
  if (LF.from) q = q.gte('created_at', LF.from + 'T00:00:00');
  if (LF.to) q = q.lte('created_at', LF.to + 'T23:59:59');
  const s = LF.q.trim().replace(/[,()*%\\]/g, ' ').trim();
  if (s) q = q.or(['recipient_name', 'requester_name', 'requester_email', 'icar_id', 'verification_code'].map(c => `${c}.ilike.*${s}*`).join(','));
  return q;
}
function lettersTable(rows, actions = true) {

}

let LROWS = [];
async function loadLetters() {
  const from = LF.page * LF.size;
  const { data, count, error } = await lettersQuery('*', { count: 'exact' }).range(from, from + LF.size - 1);
  const res = $('#lfRes'); if (!res) return;
  if (error) return res.innerHTML = `<div class="alert err">${esc(error.message)}</div>`;
  LROWS = data || [];
  const pages = Math.max(1, Math.ceil((count || 0) / LF.size));
  res.innerHTML = LROWS.length ? `<div class="tablewrap">${lettersTable(LROWS)}</div>
    <div class="pager"><span class="muted">${(count || 0).toLocaleString()} letters · page ${LF.page + 1} of ${pages}</span>
      <button class="btn sm secondary" id="pgPrev" ${LF.page === 0 ? 'disabled' : ''}>Previous</button><button class="btn sm secondary" id="pgNext" ${LF.page + 1 >= pages ? 'disabled' : ''}>Next</button></div>`
    : '<p class="muted">No letters match these filters.</p>';
  $('#pgPrev') && ($('#pgPrev').onclick = () => { LF.page--; loadLetters(); });
  $('#pgNext') && ($('#pgNext').onclick = () => { LF.page++; loadLetters(); });
  $$('[data-pdf]', res).forEach(b => b.onclick = () => staffPdf(LROWS.find(r => String(r.id) === b.dataset.pdf), b));
}
async function staffPdf(r, btn) {

  try {
    let rec = null;
    if (r.recognition_id) ({ data: rec } = await sb.from('recognitions').select('*').eq('id', r.recognition_id).maybeSingle());
    const L = { program: r.program, language: r.language, name: r.recipient_name, icar_id: r.icar_id, code: r.verification_code, issued_at: r.created_at,
      shop_name: rec?.shop_name, address: rec?.address, city: rec?.city, province: rec?.province, postal_code: rec?.postal_code, recognition_date: rec?.recognition_date };
    const doc = await buildLetterPdf(L, await loadContent(true)); doc.save(letterFilename(L));
  } catch (e) { toast(e.message, 'err'); } finally { busy(btn, false); }
}
async function exportLetters(e) {
  const btn = e.currentTarget; busy(btn, true, 'Exporting…');
  try {
    const all = [];
    for (let i = 0; i < 100; i++) {
      const { data, error } = await lettersQuery('*').range(i * 1000, i * 1000 + 999);
      if (error) throw error; all.push(...data); if (data.length < 1000) break;
    }
    const cols = [['created_at', 'Issued'], ['program', 'Recognition'], ['recipient_name', 'Letter for'], ['icar_id', 'I-CAR ID'], ['requester_name', 'Requested by'], ['requester_email', 'Email'], ['marketing_consent', 'Email opt-in'], ['language', 'Language'], ['verification_code', 'Verification code']];
    const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const csv = '﻿' + [cols.map(c => c[1]).join(','), ...all.map(r => cols.map(([k]) => cell(k === 'program' ? PROGRAM[r[k]]?.en : k === 'marketing_consent' ? (r[k] ? 'Yes' : 'No') : k === 'created_at' ? new Date(r[k]).toISOString() : r[k])).join(','))].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `icar-recognition-letters-${new Date().toISOString().slice(0, 10)}.csv`; a.click(); URL.revokeObjectURL(a.href);
    toast(`Exported ${all.length.toLocaleString()} letters`);
  } catch (err) { toast(err.message, 'err'); } finally { busy(btn, false); }
}

        <label class="btn sm secondary" style="flex:0 0 auto">Upload PNG/JPG<input type="file" accept="image/png,image/jpeg" id="s_logo" hidden></label>${S.logo_data ? '<button class="btn sm ghost" id="logoX" style="flex:0 0 auto">Remove</button>' : ''}</div></div>
      <div><label class="f">Signature image</label><div class="row" style="align-items:center">${S.signature_data ? `<img class="imgprev" src="${esc(S.signature_data)}" alt="Signature">` : '<span class="muted small">No signature image</span>'}
        <label class="btn sm secondary" style="flex:0 0 auto">Upload PNG/JPG<input type="file" accept="image/png,image/jpeg" id="s_sig" hidden></label>${S.signature_data ? '<button class="btn sm ghost" id="sigX" style="flex:0 0 auto">Remove</button>' : ''}</div>
        <div class="help">A transparent PNG of the signature works best.</div></div>
      <div><label class="f" for="s_name">Signed by</label><input id="s_name" type="text" value="${esc(S.signatory_name)}"></div>
      <div class="row"><div><label class="f" for="s_ten">Title (English)</label><input id="s_ten" type="text" value="${esc(S.signatory_title_en)}"></div>
        <div><label class="f" for="s_tfr">Title (French)</label><input id="s_tfr" type="text" value="${esc(S.signatory_title_fr)}"></div></div>
      <div><label class="f" for="s_foot">Footer line</label><input id="s_foot" type="text" value="${esc(S.footer_text)}"></div>
      <div><label class="f" for="s_mail">Customer contact email</label><input id="s_mail" type="email" value="${esc(S.support_email)}" placeholder="e.g. info@i-car.ca"><div class="help">Shown on the customer page</div></div>
      <div><label class="f" for="s_acc">Accent colour</label><input id="s_acc" type="color" value="${esc(S.accent_color || '#C8102E')}" style="width:80px;height:44px;padding:4px"></div>
    </div></div>
    <div class="card spread"><span class="muted small">Changes apply to every letter downloaded after you save.</span><button class="btn" id="saveDesign">Save changes</button></div>`;

  const grab = () => {
    if ($('#t_head')) { D.T[cur] = { ...(D.T[cur] || { program: cur.replace(/_(en|fr)$/, ''), language: cur.slice(-2) }), heading: $('#t_head').value, body: $('#t_body').value }; }
    Object.assign(D.S, { org_name: $('#s_org').value, signatory_name: $('#s_name').value, signatory_title_en: $('#s_ten').value, signatory_title_fr: $('#s_tfr').value, footer_text: $('#s_foot').value, support_email: $('#s_mail').value.trim(), accent_color: $('#s_acc').value });
  };
  const bindTpl = () => {
    $$('[data-tpl]').forEach(b => b.onclick = () => { grab(); cur = b.dataset.tpl; $('#tplBox').innerHTML = tplEditor(); bindTpl(); });
    $$('[data-ph]').forEach(s => s.onclick = () => { const ta = $('#t_body'), ins = `{{${s.dataset.ph}}}`; const p = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, p) + ins + ta.value.slice(ta.selectionEnd ?? p); ta.focus(); ta.selectionStart = ta.selectionEnd = p + ins.length; });
    $('#t_prev').onclick = async () => {
      grab(); const [p, l] = [cur.replace(/_(en|fr)$/, ''), cur.slice(-2)];
      const sample = p === 'gold_class'
        ? { program: p, language: l, name: 'Sample Collision Centre Ltd.', icar_id: 'SAMPLE-0001', address: '123 Main Street', city: 'Toronto', province: 'ON', postal_code: 'M5V 1A1', recognition_date: '2026-03-15', code: 'SAMPL-E0000' }
        : { program: p, language: l, name: 'Alex Sample', icar_id: 'SAMPLE-0002', shop_name: 'Sample Collision Centre Ltd.', recognition_date: '2026-03-15', code: 'SAMPL-E0000' };
      const doc = await buildLetterPdf(sample, { settings: D.S, templates: Object.values(D.T) });
      window.open(doc.output('bloburl'), '_blank') || doc.save('preview.pdf');
    };
  };
  bindTpl();
  const imgInput = (id, key, maxW) => $(id).onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (f.size > 5e6) return toast('Use an image under 5 MB', 'err');
    grab(); D.S[key] = await shrinkImage(f, maxW); await saveDesign(D, true); viewDesign();
  };
  imgInput('#s_logo', 'logo_data', 900); imgInput('#s_sig', 'signature_data', 700);
  $('#logoX') && ($('#logoX').onclick = async () => { grab(); D.S.logo_data = null; await saveDesign(D, true); viewDesign(); });
  $('#sigX') && ($('#sigX').onclick = async () => { grab(); D.S.signature_data = null; await saveDesign(D, true); viewDesign(); });
  $('#saveDesign').onclick = async e => { grab(); busy(e.currentTarget, true, 'Saving…'); await saveDesign(D); busy(e.currentTarget, false); };
}
function shrinkImage(file, maxW) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => { const s = Math.min(1, maxW / i.naturalWidth); const c = document.createElement('canvas'); c.width = Math.round(i.naturalWidth * s); c.height = Math.round(i.naturalHeight * s); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); res(c.toDataURL(file.type === 'image/jpeg' ? 'image/jpeg' : 'image/png', .92)); }; i.onerror = rej; i.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); });
}
async function saveDesign(D, quiet) {
  const uid = ADM.session.user.id, S = D.S;
  const { error: e1 } = await sb.from('letter_settings').update({ org_name: S.org_name, signatory_name: S.signatory_name, signatory_title_en: S.signatory_title_en, signatory_title_fr: S.signatory_title_fr, footer_text: S.footer_text, support_email: S.support_email || '', accent_color: S.accent_color, logo_data: S.logo_data, signature_data: S.signature_data, updated_at: new Date().toISOString(), updated_by: uid }).eq('id', 1);
  if (e1) return toast(e1.message, 'err');
  for (const t of Object.values(D.T)) {
    const { error } = await sb.from('letter_templates').update({ heading: t.heading, body: t.body, updated_at: new Date().toISOString(), updated_by: uid }).eq('program', t.program).eq('language', t.language);
    if (error) return toast(error.message, 'err');
  }
  await loadContent(true); toast(quiet ? 'Image saved' : 'Letter design saved');
}

/* ---------- Team ---------- */
async function viewTeam() {
  loading();
  const { data: staff, error } = await sb.from('staff').select('*').order('created_at');
  if (error) return view().innerHTML = `<div class="alert err">${esc(error.message)}</div>`;
  const me = ADM.session.user.id;
  view().innerHTML = `<div class="grid2" style="align-items:start">
    <div class="card"><h2>Team members</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
      ${staff.map(s => `<tr><td><b>${esc(s.full_name || '—')}</b><div class="small muted">${esc(s.email)}</div></td>
        <td>${s.user_id === me ? '<span class="badge">Admin (you)</span>' : `<select data-role="${s.user_id}" style="min-height:34px;padding:4px 8px;width:auto"><option value="staff" ${s.role === 'staff' ? 'selected' : ''}>Staff</option><option value="admin" ${s.role === 'admin' ? 'selected' : ''}>Admin</option></select>`}</td>
        <td>${s.active ? '<span class="badge ok">Active</span>' : '<span class="badge off">Deactivated</span>'}</td>
        <td class="nowrap">${s.user_id === me ? '' : `<button class="btn sm secondary" data-reset="${s.user_id}">Reset password</button> <button class="btn sm ${s.active ? 'danger' : 'secondary'}" data-active="${s.user_id}" data-to="${!s.active}">${s.active ? 'Deactivate' : 'Reactivate'}</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="help">Staff can upload lists, view and export letters, and edit the letter design. Admins can also manage the team.</p></div>
    <div class="card stack"><h2>Add a team member</h2>
      <form id="addForm" class="stack">
        <div><label class="f" for="a_name">Name</label><input id="a_name" type="text" required></div>
        <div><label class="f" for="a_email">Email</label><input id="a_email" type="email" required></div>
        <div><label class="f" for="a_role">Role</label><select id="a_role"><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
        <button class="btn" id="addBtn">Add and create temporary password</button>
      </form>
      <p class="help" style="margin:0">You’ll see a temporary password to give them. They’ll choose their own the first time they sign in.</p></div></div>`;
  const call = async body => { const { data, error } = await sb.functions.invoke('manage-staff', { body }); if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); } return data; };
  const showTemp = (email, pw) => { openModal(`<h2>Temporary password</h2><p>Give this to <b>${esc(email)}</b> along with the sign-in link. It won’t be shown again.</p>
      <div class="alert info"><div class="small muted">Sign-in link</div><div class="small" style="word-break:break-all">${esc(publicUrl() + '#/admin')}</div><div class="small muted" style="margin-top:8px">Temporary password</div><div class="code bigcode">${esc(pw)}</div></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="cpyTmp">Copy both</button><button class="btn secondary" id="closeTmp">Done</button></div>`);
    $('#cpyTmp').onclick = () => copyText(`Sign in: ${publicUrl()}#/admin\nEmail: ${email}\nTemporary password: ${pw}`); $('#closeTmp').onclick = () => { closeModal(); viewTeam(); }; };
  $('#addForm').onsubmit = async e => {
    e.preventDefault(); busy($('#addBtn'), true, 'Adding…');
    try { const r = await call({ action: 'create_user', full_name: $('#a_name').value.trim(), email: $('#a_email').value.trim(), role: $('#a_role').value }); showTemp(r.email, r.temp_password); }

}

/* =====================================================================
   ROUTER
   ===================================================================== */
async function route() {
  const h = location.hash || '';
  closeModal();
  if (h.startsWith('#/admin') || /access_token=|type=(signup|recovery|invite)|error_description=/.test(h)) {
    if (!h.startsWith('#/admin')) setTimeout(() => history.replaceState(null, '', location.pathname + location.search + '#/admin'), 400);
    return renderAdmin();
  }
  try { await loadContent(); } catch (e) { console.error(e); }
  if (h.startsWith('#/verify')) return renderVerify(decodeURIComponent(h.slice('#/verify/'.length) || '').trim());
  renderRequest();
}
window.addEventListener('hashchange', route);
route();
</script>
