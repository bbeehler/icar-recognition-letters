<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I-CAR Recognition Letters</title>
<meta name="description" content="Download your official I-CAR Canada Gold Class or Platinum recognition letter.">
<link rel="icon" href="assets/icar-canada-logo.svg">
<style>
/* I-CAR Canada design system: tokens */
@font-face{font-family:"Source Sans 3";src:url(assets/fonts/SourceSans3-400-normal.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Source Sans 3";src:url(assets/fonts/SourceSans3-600-normal.woff2) format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"Source Sans 3";src:url(assets/fonts/SourceSans3-700-normal.woff2) format("woff2");font-weight:700;font-style:normal;font-display:swap}
:root{
  --surface:#ffffff; --ink:#000000; --ink-muted:#575e69; --on-brand:#ffffff;
  --icar-blue:#006cb4; --icar-blue-edge:#00365a; --icar-blue-25:#bac9e6; --navy:#003663; --sky-25:#d7e3f4;
  --charcoal:#575e69; --charcoal-25:#c9cdd3; --gray-25:#dfe2e5; --tan-25:#f1f1ef;
  --gold-class:#a39053; --gc-brown:#1f1a00; --platinum:#a7a9ac;
  --green:#367c53; --green-25:#c5d3c6; --red:#c5351c; --red-25:#f0c4ae; --sunshine-25:#fce7c3; --orange:#f47920;
  --rule:var(--icar-blue); --link:var(--icar-blue); --focus-ring:var(--navy);
  --font-web:"Source Sans 3","Source Sans Pro",Arial,sans-serif;
  --space-hairline:3px; --space-xs:6px; --space-sm:12px; --space-logo:19px; --space-md:24px; --space-lg:29px; --space-xl:48px;
  --radius-box:6px; --shadow-box:0 2px 6px rgba(0,0,0,.35); --shadow-soft:0 1px 3px rgba(0,0,0,.12);
  --grad-blue:linear-gradient(90deg,var(--icar-blue-edge),var(--icar-blue) 40%,var(--icar-blue) 60%,var(--icar-blue-edge));
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--tan-25);color:var(--ink);font:400 17px/1.55 var(--font-web);-webkit-font-smoothing:antialiased}
a{color:var(--link)}
h1,h2,h3{margin:0 0 .4em;line-height:1.2}
h1{font-size:40px;font-weight:700;line-height:1.15}
h2{font-size:28px;font-weight:600;color:var(--icar-blue)}
h3{font-size:20px;font-weight:600}
p{margin:0 0 1em}
.muted{color:var(--ink-muted)}
.small{font-size:14px;line-height:1.45}
.hidden{display:none!important}
.section-head{font-weight:700;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--icar-blue);margin:0 0 var(--space-sm)}
.section-head .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--icar-blue);color:#fff;font-size:13px;margin-right:8px;vertical-align:1px}

/* header and footer */
.site-head{background:var(--surface);border-bottom:3px solid var(--icar-blue)}
.site-head .in{max-width:1180px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.site-head .logo{height:44px;width:auto;display:block}
.site-head .tag{font-weight:600;color:var(--ink-muted);font-size:15px;border-left:1px solid var(--charcoal-25);padding-left:14px;margin-left:14px}
.brand{display:flex;align-items:center}
@media (max-width:560px){.site-head .tag{display:none}.site-head .logo{height:36px}}
.site-foot-wrap{background:var(--surface);border-top:1px solid var(--gray-25);margin-top:var(--space-xl)}
.site-foot{max-width:1180px;margin:0 auto;padding:24px 16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--ink-muted)}
.site-foot img{height:44px;width:auto;display:block}

/* public page */
.pub{max-width:760px;margin:0 auto;padding:28px 16px 0}
.headline-box{background:var(--grad-blue);color:var(--on-brand);border-radius:var(--radius-box);box-shadow:var(--shadow-box);padding:var(--space-lg) var(--space-xl);margin-bottom:var(--space-md)}
.headline-box h1{color:#fff;margin:0;font-size:36px}
.headline-box hr{border:0;border-top:1px solid rgba(255,255,255,.9);margin:var(--space-sm) 0}
.headline-box p{margin:0;font-size:19px;line-height:1.4}
@media (max-width:560px){.headline-box{padding:var(--space-md)}.headline-box h1{font-size:28px}.headline-box p{font-size:17px}}
.panel{background:var(--surface);border-radius:var(--radius-box);box-shadow:var(--shadow-soft);padding:var(--space-lg)}
@media (max-width:560px){.panel{padding:var(--space-md) 18px}}
.panel + .panel{margin-top:var(--space-md)}
.grid2 > .panel{margin-top:0}
.step + .step{margin-top:var(--space-lg);padding-top:var(--space-lg);border-top:1px solid var(--gray-25)}

/* forms */
label.f{display:block;font-weight:600;font-size:15px;margin-bottom:5px}
.help{font-size:14px;color:var(--ink-muted);margin-top:4px;line-height:1.4}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=date],select,textarea{
  width:100%;font:inherit;font-size:17px;color:inherit;background:var(--surface);border:1px solid var(--charcoal);border-radius:var(--radius-box);padding:9px 12px;min-height:44px}
textarea{min-height:200px;line-height:1.5;resize:vertical;font-size:15px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.choice:focus-within{outline:2px solid var(--focus-ring);outline-offset:2px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row > *{flex:1 1 220px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--icar-blue)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.choices{grid-template-columns:1fr}}
.choice{position:relative;display:flex;gap:16px;align-items:center;border:2px solid var(--gray-25);border-radius:var(--radius-box);padding:14px 16px;cursor:pointer;background:var(--surface)}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice img{height:84px;width:auto;flex:none}
.choice b{display:block;font-size:18px}
.choice span{font-size:14px;color:var(--ink-muted);line-height:1.35;display:block}
.choice:hover{border-color:var(--icar-blue-25)}
.choice:has(input:checked){border-color:var(--icar-blue);box-shadow:inset 0 0 0 1px var(--icar-blue)}
.choice:has(input:checked)::after{content:"✓";position:absolute;top:8px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--icar-blue);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 var(--space-md);border:2px solid var(--icar-blue);border-radius:var(--radius-box);
  font:600 17px/1 var(--font-web);cursor:pointer;background:var(--icar-blue);color:var(--on-brand);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--navy);border-color:var(--navy)}
.btn.secondary{background:var(--surface);color:var(--icar-blue)}
.btn.secondary:hover{background:var(--sky-25);color:var(--navy);border-color:var(--navy)}
.btn.sm{min-height:34px;padding:0 12px;font-size:15px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--icar-blue);padding:0 8px}
.btn.ghost:hover{background:var(--sky-25)}
.btn.danger{background:var(--surface);color:var(--red);border-color:var(--red)}
.btn[disabled]{cursor:not-allowed;background:var(--gray-25);border-color:var(--gray-25);color:var(--charcoal)}
.btn.block{width:100%}
.btn.lg{min-height:52px;font-size:19px}

.alert{border-radius:var(--radius-box);padding:12px 14px;font-size:15px;line-height:1.45}
.alert.err{background:var(--red-25);color:#5d1608;border-left:4px solid var(--red)}
.alert.ok{background:var(--green-25);color:#163a25;border-left:4px solid var(--green)}
.alert.warn{background:var(--sunshine-25);color:#4d3600;border-left:4px solid var(--orange)}
.alert.info{background:var(--sky-25);color:var(--navy);border-left:4px solid var(--icar-blue)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.03em}
.lang-toggle{display:flex;border:1px solid var(--icar-blue);border-radius:var(--radius-box);overflow:hidden;flex:none}
.lang-toggle button{font:600 14px var(--font-web);border:0;background:var(--surface);color:var(--icar-blue);padding:6px 12px;cursor:pointer;min-height:34px}
.lang-toggle button.on{background:var(--icar-blue);color:#fff}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--gray-25);color:var(--charcoal);white-space:nowrap;line-height:1.6}
.badge.gold{background:#efe9d6;color:#4d4220}
.badge.plat{background:#ebecee;color:#3a3d42}
.badge.ok{background:var(--green-25);color:#163a25}
.badge.blue{background:var(--sky-25);color:var(--navy)}
.badge.warn{background:var(--sunshine-25);color:#4d3600}
.badge.off{background:var(--red-25);color:#5d1608}
.ready{display:flex;gap:20px;align-items:center}
.ready img{height:110px;width:auto;flex:none}
@media (max-width:520px){.ready{flex-direction:column;align-items:flex-start}}
.refbox{background:var(--tan-25);border-radius:var(--radius-box);padding:12px 16px}

/* staff */
.tabs{background:var(--surface);border-bottom:1px solid var(--gray-25);overflow-x:auto}
.tabs .in{max-width:1180px;margin:0 auto;padding:0 8px;display:flex;gap:2px}
.tabs button{font:600 16px var(--font-web);background:none;border:0;border-bottom:3px solid transparent;padding:12px 12px 10px;cursor:pointer;color:var(--ink-muted);white-space:nowrap}
.tabs button:hover{color:var(--navy)}
.tabs button.on{color:var(--icar-blue);border-bottom-color:var(--icar-blue)}
.adm{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
.whoami{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-muted);flex:none}
@media (max-width:700px){.whoami .name{display:none}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:var(--space-md)}
.stat{background:var(--surface);border-radius:var(--radius-box);box-shadow:var(--shadow-soft);padding:16px 18px;border-top:4px solid var(--icar-blue)}
.stat.alt{border-top-color:var(--orange)}
.stat .n{font-size:32px;font-weight:700;line-height:1.1}
.stat .l{font-size:14px;color:var(--ink-muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);align-items:start}
@media (max-width:880px){.grid2{grid-template-columns:1fr}}
.grid2 + .panel,.panel + .grid2,.stats + .grid2{margin-top:var(--space-md)}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tablewrap{overflow-x:auto;border:1px solid var(--gray-25);border-radius:var(--radius-box);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--gray-25);vertical-align:top}
th{background:var(--tan-25);font-weight:600;font-size:13px;color:var(--charcoal);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nowrap{white-space:nowrap}
td .sub{font-size:13px;color:var(--ink-muted)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .grow{flex:1 1 240px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 15px var(--font-web);border:1px solid var(--charcoal-25);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:36px}
.chip .c{color:var(--ink-muted);font-weight:400;margin-left:4px}
.chip.on{background:var(--icar-blue);border-color:var(--icar-blue);color:#fff}
.chip.on .c{color:#d7e3f4}
.seg{display:inline-flex;border:2px solid var(--icar-blue);border-radius:var(--radius-box);overflow:hidden}
.seg button{font:600 16px var(--font-web);border:0;background:var(--surface);color:var(--icar-blue);padding:8px 16px;cursor:pointer}
.seg button.on{background:var(--icar-blue);color:#fff}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:15px}
.mapgrid{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:8px 16px;align-items:center}
@media (max-width:560px){.mapgrid{grid-template-columns:1fr}}
.req{color:var(--red)}
.ph{display:inline-block;background:var(--tan-25);border:1px solid var(--charcoal-25);border-radius:4px;padding:0 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;cursor:pointer;margin:2px 0}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;font-size:15px}
.imgprev{max-height:56px;max-width:220px;border:1px dashed var(--charcoal-25);border-radius:4px;padding:4px;background:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(0,26,48,.5);display:grid;place-items:center;padding:16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--radius-box);max-width:500px;width:100%;padding:var(--space-lg);box-shadow:var(--shadow-box);border-top:4px solid var(--icar-blue)}
.modal.wide{max-width:880px}
.modal .x{float:right;margin:-8px -8px 0 0}
.history{list-style:none;margin:0;padding:0;font-size:14px}
.history li{padding:8px 0;border-bottom:1px solid var(--gray-25)}
.history li:last-child{border-bottom:0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--navy);color:#fff;padding:10px 18px;border-radius:var(--radius-box);font-size:15px;box-shadow:var(--shadow-box);max-width:90vw}
#toast div.err{background:var(--red)}
.spinner{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:grid;place-items:center;min-height:50vh}
</style>
</head>
<body>
<div id="app"><div class="center"><span class="spinner" style="color:#006cb4"></span></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
/* =====================================================================
   I-CAR Canada Recognition Letters
   Customer page:   index.html        (personal link: ?program=gold_class&id=12345&lang=fr)
   Staff back end:  index.html#/admin
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://fwtzwkdcxkcnscqkyxhf.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3dHp3a2RjeGtjbnNjcWt5eGhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwMjczNTgsImV4cCI6MjEwODYwMzM1OH0.p3WJnw5_Y4-Lk0kYU6JW_lzor6r7DC1GcfQEuLUF1KQ',
  STAFF_EMAIL_DOMAIN: 'aiacanada.com',
  // Leave blank to use this page's own address in the links the team sends.
  PUBLIC_URL: ''
};
const XLSX_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
const ASSET = {
  logo: 'assets/icar-canada-logo.svg',
  logoPng: 'assets/icar-canada-logo.png',
  gold_class: { en: 'assets/gold-class-en.png', fr: 'assets/gold-class-fr.png' },
  platinum: { en: 'assets/platinum-en.png', fr: 'assets/platinum-fr.png' }
};

const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const app = document.getElementById('app');

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(msg, kind = '') { const d = document.createElement('div'); d.textContent = msg; if (kind) d.className = kind; $('#toast').appendChild(d); setTimeout(() => d.remove(), kind === 'err' ? 6000 : 3000); }
function publicUrl() { return (CONFIG.PUBLIC_URL || (location.origin + location.pathname)).replace(/[?#].*$/, ''); }
function personalLink(program, icarId, lang) { const p = new URLSearchParams({ program, id: icarId }); if (lang === 'fr') p.set('lang', 'fr'); return publicUrl() + '?' + p.toString(); }
function parseDate(d) { if (!d) return null; if (d instanceof Date) return d; return new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d + 'T12:00:00' : d); }
function fmtDate(d, lang = 'en') { const dt = parseDate(d); if (!dt || isNaN(dt)) return ''; return dt.toLocaleDateString(lang === 'fr' ? 'fr-CA' : 'en-CA', { year: 'numeric', month: 'long', day: 'numeric' }); }
function fmtShort(d) { const dt = parseDate(d); return dt ? dt.toLocaleDateString('en-CA', { year: 'numeric', month: 'short', day: 'numeric' }) : ''; }
function fmtDateTime(d) { const dt = parseDate(d); return dt ? dt.toLocaleString('en-CA', { year: 'numeric', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''; }
function busy(btn, on, label) { if (!btn) return; if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> ' + esc(label || ''); } else { btn.disabled = false; if (btn.dataset.l) btn.innerHTML = btn.dataset.l; } }
async function copyText(t, what = 'Copied') { try { await navigator.clipboard.writeText(t); toast(what); } catch { toast('Copy failed. Select the text and copy it manually.', 'err'); } }
function loadScript(src) { return new Promise((res, rej) => { if ([...document.scripts].some(s => s.src === src)) return res(); const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
function csvDownload(rows, cols, name) {
  const cell = v => { const s = String(v ?? ''); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = '﻿' + [cols.map(c => c[1]).join(','), ...rows.map(r => cols.map(([k, , f]) => cell(f ? f(r) : r[k])).join(','))].join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
const PROGRAM = {
  gold_class: { en: 'Gold Class', fr: 'Gold Class', mark: 'Gold Class®', badge: 'gold', slug: 'Gold-Class' },
  platinum: { en: 'Platinum', fr: 'Platinum', mark: 'Platinum™', badge: 'plat', slug: 'Platinum' }
};

/* ---------- letter content (wording, signatory, signature) ---------- */
let CONTENT = null;
async function loadContent(force = false) {
  if (!CONTENT || force) { const { data, error } = await sb.rpc('get_letter_content'); if (error) throw error; CONTENT = data || { settings: {}, templates: [] }; }
  return CONTENT;
}

/* ---------- PDF letter (I-CAR letterhead) ---------- */
const IMG_CACHE = {};
async function imgData(src) {
  if (!src) return null;
  if (src.startsWith('data:')) return src;
  if (!IMG_CACHE[src]) IMG_CACHE[src] = fetch(src).then(r => { if (!r.ok) throw new Error(src); return r.blob(); })
    .then(b => new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); })).catch(() => null);
  return IMG_CACHE[src];
}
function imgDims(src) { return new Promise(r => { const i = new Image(); i.onload = () => r({ w: i.naturalWidth, h: i.naturalHeight }); i.onerror = () => r(null); i.src = src; }); }
function fill(t, v) { return String(t || '').replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (v[k] ?? '')); }
const BLUE = [0, 108, 180], CHARCOAL = [87, 94, 105];
const PDF_T = { en: { ref: 'Letter reference' }, fr: { ref: 'Référence de la lettre' } };

/* L = { program, language, name, icar_id, shop_name, address, city, province, postal_code, recognition_date, issued_at, code } */
async function buildLetterPdf(L, content) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'letter', compress: true });
  const S = content.settings || {};
  const lang = L.language === 'fr' ? 'fr' : 'en';
  const tpl = (content.templates || []).find(t => t.program === L.program && t.language === lang) || { heading: '', body: '' };
  const W = 612, H = 792, M = 72, CW = W - 2 * M, BOTTOM = H - 108;   // letterhead: 1in sides, 1.5in bottom
  const issued = L.issued_at ? parseDate(L.issued_at) : new Date();
  const v = { name: L.name || '', icar_id: L.icar_id || '', shop_name: L.shop_name || '', date: fmtDate(issued, lang),
    recognition_date: L.recognition_date ? fmtDate(L.recognition_date, lang) : '', program: PROGRAM[L.program]?.[lang] || '' };
  doc.setProperties({ title: fill(tpl.heading, v), author: 'I-CAR Canada', subject: v.name });

  const [logo, prog, sig] = await Promise.all([imgData(ASSET.logoPng), imgData(ASSET[L.program]?.[lang]), imgData(S.signature_data)]);
  const header = async () => {
    if (logo) { const d = await imgDims(logo); const w = 92, h = w * d.h / d.w; doc.addImage(logo, 'PNG', M, 44, w, h, 'icar-logo', 'FAST'); }   // 1.28in letterhead logo
    if (prog) { const d = await imgDims(prog); const h = 64, w = h * d.w / d.h; doc.addImage(prog, 'PNG', W - M - w, 34, w, h, 'prog-logo', 'FAST'); } // program logo, 0.9in tall
    doc.setDrawColor(...BLUE); doc.setLineWidth(1); doc.line(M, 112, W - M, 112);
  };
  const footer = (page, pages) => {
    doc.setDrawColor(...BLUE); doc.setLineWidth(1); doc.line(M, H - 72, W - M, H - 72);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...CHARCOAL);
    if (S.footer_text) doc.text(S.footer_text, M, H - 58);
    const right = [L.code ? `${PDF_T[lang].ref}: ${L.code}` : '', pages > 1 ? `${page}/${pages}` : ''].filter(Boolean).join('   ');
    if (right) doc.text(right, W - M, H - 58, { align: 'right' });
  };
  await header();
  let y = 126 + 10;   // 1.75in top margin
  const body = () => { doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(0, 0, 0); };
  const LH = 14.5;
  const newPage = async () => { doc.addPage(); await header(); body(); return 136; };

  body(); doc.text(v.date, M, y); y += LH * 2;
  const addr = [];
  if (L.program === 'platinum' && L.shop_name) addr.push(L.shop_name);
  if (L.address) addr.push(L.address);
  const cityLine = ([L.city, L.province].filter(Boolean).join(', ') + (L.postal_code ? '  ' + L.postal_code : '')).trim();
  if (cityLine) addr.push(cityLine);
  doc.setFont('helvetica', 'bold'); doc.text(doc.splitTextToSize(v.name, CW)[0], M, y); y += LH;
  body(); for (const a of addr) { doc.text(doc.splitTextToSize(a, CW)[0], M, y); y += LH; }
  y += LH;

  doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...BLUE);
  for (const line of doc.splitTextToSize(fill(tpl.heading, v), CW)) { doc.text(line, M, y); y += 17; }
  y += 8; body();

  for (const p of fill(tpl.body, v).split(/\n\s*\n/)) {
    const txt = p.replace(/\s*\n\s*/g, ' ').trim(); if (!txt) continue;
    for (const line of doc.splitTextToSize(txt, CW)) { if (y > BOTTOM) y = await newPage(); doc.text(line, M, y); y += LH; }
    y += 7;
  }
  if (y + 80 > BOTTOM) y = await newPage();
  if (sig) { const d = await imgDims(sig); if (d) { let h = 38, w = h * d.w / d.h; if (w > 170) { w = 170; h = w * d.h / d.w; } doc.addImage(sig, sig.startsWith('data:image/png') ? 'PNG' : 'JPEG', M, y - 4, w, h); y += h + 6; } } else y += 28;
  if (S.signatory_name) { doc.setFont('helvetica', 'bold'); doc.text(S.signatory_name, M, y); y += LH; }
  const title = lang === 'fr' ? S.signatory_title_fr : S.signatory_title_en;
  if (title) { body(); doc.text(title, M, y); }
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) { doc.setPage(i); footer(i, pages); }
  return doc;
}

async function submitRequest(e) {
  e.preventDefault(); savePubForm();
  const t = T[LANG], f = PUB.form, btn = $('#reqBtn'), msg = $('#reqMsg');
  const checkWord = PUB.program === 'gold_class' ? t.checkGold : t.checkPlat;
  const showErr = k => { msg.innerHTML = `<div class="alert err" role="alert">${esc((t.err[k] || t.err.generic).replace('{check}', checkWord))}</div>`; };
  msg.innerHTML = '';
  if (!String(f.icar_id || '').trim() || !String(f.check || '').trim()) return showErr('missing_fields');
  if (!String(f.rname || '').trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f.remail || '').trim())) return showErr('invalid_contact');
  busy(btn, true, t.working);
  try {
    const { data, error } = await sb.rpc('request_letter', { p_program: PUB.program, p_icar_id: f.icar_id, p_check: f.check,
      p_requester_name: f.rname, p_requester_email: f.remail, p_language: f.letter_lang || LANG, p_marketing_consent: !!f.consent });
    if (error) throw error;
    if (!data?.ok) { busy(btn, false); return showErr(data?.error || 'generic'); }
    busy(btn, true, t.making);
    await loadContent(true);
    PUB.result = data;
    await downloadLetter(data);
    renderReady();
  } catch (err) { console.error(err); busy(btn, false); showErr('generic'); }
}

function excelDateToISO(v) {
  if (v === '' || v == null) return '';
  if (v instanceof Date && !isNaN(v)) return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  if (typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5)).toISOString().slice(0, 10);
  const s = String(v).trim(); if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s); return isNaN(d) ? '' : new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
async function startUpload(program, file) {
  const area = $('#uploadArea');
  area.innerHTML = `<div class="panel" style="margin-bottom:var(--space-md)"><span class="spinner"></span> Reading ${esc(file.name)}…</div>`;
  try {
    await loadScript(XLSX_SRC);
    const wb = XLSX.read(await file.arrayBuffer(), { cellDates: true });
    UPLOAD = { program, file: file.name, wb, sheet: wb.SheetNames[0] };
    readSheet(); renderMapping();
  } catch (e) { area.innerHTML = `<div class="alert err" style="margin-bottom:var(--space-md)">Couldn’t read that file: ${esc(e.message)}</div>`; }
}
function readSheet() {
  const rows = XLSX.utils.sheet_to_json(UPLOAD.wb.Sheets[UPLOAD.sheet], { defval: '', raw: true });
  UPLOAD.rows = rows;
  UPLOAD.cols = rows.length ? Object.keys(rows.reduce((a, r) => Object.assign(a, r), {})) : [];
  const used = new Set(); UPLOAD.map = {};
  for (const f of FIELDS[UPLOAD.program]) { const hit = UPLOAD.cols.find(c => !used.has(c) && f.rx.test(c.trim())); if (hit) { UPLOAD.map[f.k] = hit; used.add(hit); } }
}
function buildRows() {
  const m = UPLOAD.map, P = UPLOAD.program, get = (r, k) => (m[k] ? String(r[m[k]] ?? '').trim() : '');
  return UPLOAD.rows.map(r => {
    const first = get(r, 'first_name'), last = get(r, 'last_name');
    const name = get(r, 'name') || [first, last].filter(Boolean).join(' ');
    const o = { icar_id: get(r, 'icar_id'), name, recognition_date: m.recognition_date ? excelDateToISO(r[m.recognition_date]) : '', contact_email: get(r, 'contact_email'), contact_phone: get(r, 'contact_phone') };
    if (P === 'gold_class') Object.assign(o, { address: get(r, 'address'), city: get(r, 'city'), province: get(r, 'province'), postal_code: get(r, 'postal_code'), contact_name: get(r, 'contact_name') });
    else Object.assign(o, { last_name: last, shop_name: get(r, 'shop_name'), contact_name: name });
    return o;
  });
}

const LF = { q: '', program: '', consent: '', from: '', to: '', page: 0, size: 50 };
function lettersQuery(sel = '*', opts = {}) {
  let q = sb.from('letter_requests').select(sel, opts).order('created_at', { ascending: false });
  if (LF.program) q = q.eq('program', LF.program);
  if (LF.consent) q = q.eq('marketing_consent', LF.consent === 'yes');
  if (LF.from) q = q.gte('created_at', LF.from + 'T00:00:00');
  if (LF.to) q = q.lte('created_at', LF.to + 'T23:59:59');
  const s = LF.q.trim().replace(/[,()*%\\]/g, ' ').trim();
  if (s) q = q.or(['recipient_name', 'requester_name', 'requester_email', 'icar_id', 'verification_code'].map(c => `${c}.ilike.*${s}*`).join(','));
  return q;
}
function lettersTable(rows, actions = true) {

      <td class="mono nowrap">${esc(r.verification_code)}</td>${actions ? `<td><button class="btn sm secondary" data-pdf="${r.id}">PDF</button></td>` : ''}</tr>`).join('')}
  </tbody></table>`;
}

let LROWS = [];
async function loadLetters() {
  const from = LF.page * LF.size;
  const { data, count, error } = await lettersQuery('*', { count: 'exact' }).range(from, from + LF.size - 1);
  const res = $('#lfRes'); if (!res) return;
  if (error) return res.innerHTML = `<div class="alert err">${esc(error.message)}</div>`;
  LROWS = data || [];

    <div class="pager"><span class="muted">${(count || 0).toLocaleString()} letters · page ${LF.page + 1} of ${pages}</span>

    : '<p class="muted">No letters match these filters.</p>';

function shrinkImage(file, maxW) {

}

        <div style="margin-top:12px"><label class="f" for="a_email">Email</label><input id="a_email" type="email" required></div>
        <div style="margin-top:12px"><label class="f" for="a_role">Role</label><select id="a_role"><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
        <button class="btn" id="addBtn" style="margin-top:14px">Add and create temporary password</button>
      </form>
      <p class="help" style="margin:12px 0 0">You’ll see a temporary password to give them. They choose their own the first time they sign in.</p></div></div>`;
  const call = async body => { const { data, error } = await sb.functions.invoke('manage-staff', { body }); if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); } return data; };
  const showTemp = (email, pw) => { openModal(`<h2>Temporary password</h2><p>Give this to <b>${esc(email)}</b> with the sign-in link. It won’t be shown again.</p>
      <div class="refbox"><div class="small muted">Sign-in link</div><div class="small" style="word-break:break-all">${esc(publicUrl() + '#/admin')}</div><div class="small muted" style="margin-top:8px">Temporary password</div><div class="mono" style="font-size:22px;font-weight:700">${esc(pw)}</div></div>
      <div class="row" style="margin-top:16px"><button class="btn" id="cpyTmp">Copy both</button><button class="btn secondary" id="closeTmp">Done</button></div>`);
    $('#cpyTmp').onclick = () => copyText(`Sign in: ${publicUrl()}#/admin\nEmail: ${email}\nTemporary password: ${pw}`); $('#closeTmp').onclick = () => { closeModal(); viewTeam(); }; };
  $('#addForm').onsubmit = async e => {
    e.preventDefault(); busy($('#addBtn'), true, 'Adding…');
    try { const r = await call({ action: 'create_user', full_name: $('#a_name').value.trim(), email: $('#a_email').value.trim(), role: $('#a_role').value }); showTemp(r.email, r.temp_password); }
    catch (err) { toast(err.message, 'err'); } finally { busy($('#addBtn'), false); }
  };
  $$('[data-reset]').forEach(b => b.onclick = async () => { busy(b, true); try { const r = await call({ action: 'reset_password', user_id: b.dataset.reset }); showTemp(staff.find(s => s.user_id === b.dataset.reset).email, r.temp_password); } catch (err) { toast(err.message, 'err'); } finally { busy(b, false); } });
  $$('[data-active]').forEach(b => b.onclick = async () => { busy(b, true); try { await call({ action: 'set_active', user_id: b.dataset.active, active: b.dataset.to === 'true' }); toast('Updated'); viewTeam(); } catch (err) { toast(err.message, 'err'); busy(b, false); } });
  $$('[data-role]').forEach(s => s.onchange = async () => { const { error } = await sb.from('staff').update({ role: s.value }).eq('user_id', s.dataset.role); if (error) toast(error.message, 'err'); else toast('Role updated'); });
}

/* =====================================================================
   ROUTER
   ===================================================================== */
async function route() {
  const h = location.hash || '';
  closeModal();
  if (h.startsWith('#/admin') || /access_token=|type=(signup|recovery|invite)|error_description=/.test(h)) {
    if (!h.startsWith('#/admin')) setTimeout(() => history.replaceState(null, '', location.pathname + location.search + '#/admin'), 400);
    return renderAdmin();
  }
  try { await loadContent(); } catch (e) { console.error(e); }
  renderRequest();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
